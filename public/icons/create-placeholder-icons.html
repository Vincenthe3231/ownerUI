<!DOCTYPE html>
<html>
<head>
    <title>PWA Icon Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            background: #d81e43;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #c01a38;
        }
    </style>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>This tool creates placeholder icons for your PWA. For production, replace these with your actual app logo.</p>
    
    <button onclick="generateIcons()">Generate Placeholder Icons</button>
    <button onclick="downloadAll()">Download All Icons</button>
    
    <div class="icon-grid" id="iconGrid"></div>
    
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const icons = {};
        
        function generateIcons() {
            const grid = document.getElementById('iconGrid');
            grid.innerHTML = '';
            
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                canvas.id = `icon-${size}`;
                const ctx = canvas.getContext('2d');
                
                // Create a simple gradient background
                const gradient = ctx.createLinearGradient(0, 0, size, size);
                gradient.addColorStop(0, '#d81e43');
                gradient.addColorStop(1, '#c01a38');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                
                // Add text
                ctx.fillStyle = 'white';
                ctx.font = `bold ${size / 4}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('OU', size / 2, size / 2);
                
                icons[size] = canvas.toDataURL('image/png');
                
                const div = document.createElement('div');
                div.innerHTML = `
                    <canvas id="icon-${size}" width="${size}" height="${size}"></canvas>
                    <p>${size}x${size}</p>
                `;
                grid.appendChild(div);
                
                // Copy to the canvas in the div
                const divCanvas = div.querySelector('canvas');
                const divCtx = divCanvas.getContext('2d');
                divCtx.drawImage(canvas, 0, 0);
            });
        }
        
        function downloadIcon(size, dataUrl) {
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = dataUrl;
            link.click();
        }
        
        function downloadAll() {
            sizes.forEach(size => {
                setTimeout(() => {
                    downloadIcon(size, icons[size]);
                }, size * 10);
            });
        }
        
        // Auto-generate on load
        window.onload = generateIcons;
    </script>
</body>
</html>
